server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Catalog Service
            - id: catalog-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/products/**

            # Order Service
            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/order/**

            # Identity Service
            - id: identity-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/identity/**