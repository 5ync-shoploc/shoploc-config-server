server:
  port: 8081

spring:
  application:
    name: shoploc-catalog-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shoploc-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true