server:
  port: 8082

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shoploc-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # MLD : base shoploc-db, un schéma par service -> l'order-service écrit dans le schéma "orders"
        default_schema: orders
        # crée le schéma "orders" s'il n'existe pas encore
        hbm2ddl.create_namespaces: true

shoploc:
  catalog:
    # adresse du service catalogue (appelé directement, sans passer par la Gateway)
    base-url: ${CATALOG_URL:http://localhost:8081}
